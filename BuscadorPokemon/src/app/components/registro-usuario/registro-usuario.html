<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario de Registro</title>
<link rel="stylesheet" href="CSS/styles.css">
</head>
<body>

  <div class="form-wrapper">

    <div class="form-header">
      <h1> Formulario de Registro</h1>
      <p>Por favor completa todos los campos</p>
    </div>

    <div class="form-body">
      <form id="formularioregistro" action="#">

        <!-- Nombre y Apellido -->
        <div class="form-row">
          <div class="form-group">
            <label for="nombre">Nombre<span class="required-mark">*</span></label>
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Ej: María"
                autocomplete="given-name">
            </div>
          </div>

          <div class="form-group">
            <label for="apellido">Apellido<span class="required-mark">*</span></label>
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input
                type="text"
                id="apellido"
                name="apellido"
                placeholder="Ej: Gómez"
                autocomplete="family-name">
            </div>
          </div>
        </div>

        <!-- Tipo y número de documento -->
        <div class="form-row">
          <div class="form-group">
            <label for="tipo-documento">Tipo de documento<span class="required-mark">*</span></label>
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                <circle cx="9" cy="12" r="2"></circle>
                <path d="M15 10h3M15 14h3M6 16.5c.7-1.4 2-2 3-2s2.3.6 3 2"></path>
              </svg>
              <select id="tipo_documento" name="tipo-documento">
                <option value="" disabled selected>Selecciona una opción</option>
                <option value="Cedula de Ciudadania">Cédula de Ciudadanía</option>
                <option value="Cedula de Extranjeria">Cédula de Extranjería</option>
                <option value="Pasaporte">Pasaporte</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="documento">Número de documento<span class="required-mark">*</span></label>
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                <path d="M7 9h4M7 13h7M7 16h5"></path>
              </svg>
              <div class="documento-field">
                <input type="text" id="documento" name="numero-documento" placeholder="Ej: 1234567890" required>
              </div>
            </div>
          </div>
        </div>

        <!-- Fecha de nacimiento y correo -->
        <div class="form-row">
          <div class="form-group">
            <label for="fecha_nacimiento">Fecha de nacimiento<span class="required-mark">*</span></label>
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="17" rx="2"></rect>
                <path d="M3 9h18M8 2v4M16 2v4"></path>
              </svg>
              <input
                type="date"
                id="fecha_nacimiento"
                name="fecha_nacimiento"
                autocomplete="bday">
            </div>
          </div>

          <div class="form-group">
            <label for="correo">Correo electrónico<span class="required-mark">*</span></label>
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                <path d="M3 7l9 6 9-6"></path>
              </svg>
              <input
                type="email"
                id="correo"
                name="correo"
                placeholder="Ej: nombre@correo.com"
                autocomplete="email">
            </div>
          </div>
        </div>

        <!-- País y ciudad -->
        <div class="form-row">
          <div class="form-group">
            <label for="pais">País de domicilio<span class="required-mark">*</span></label>
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M3 12h18M12 3c2.5 2.7 4 6 4 9s-1.5 6.3-4 9c-2.5-2.7-4-6-4-9s1.5-6.3 4-9z"></path>
              </svg>
              <select id="pais" name="pais">
                <option value="" disabled>Selecciona un país</option>
                <option value="169" selected>Colombia</option>
                <option value="063">Argentina</option>
                <option value="245">España</option>
                <option value="105">Brasil</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="ciudad-placeholder">Ciudad de domicilio<span class="required-mark">*</span></label>
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 21h18M6 21V8l6-4 6 4v13M9 21v-5h6v5M9 11h1M14 11h1M9 15h1M14 15h1"></path>
              </svg>
              <div class="ciudad-field">
                <select id="ciudad" name="ciudad" required>
                  <option value="" disabled selected>Selecciona una ciudad</option>
                  <option value="11001">Bogotá</option>
                  <option value="05001">Medellín</option>
                  <option value="76001">Cali</option>
                  <option value="08001">Barranquilla</option>
                  <option value="13001">Cartagena</option>
                  <option value="CABA/2000">Buenos Aires</option>
                  <option value="X5000">Córdoba</option>
                  <option value="S2000">Rosario</option>
                  <option value="M5500">Mendoza</option>
                  <option value="B1900">La Plata</option>
                  <option value="28079">Madrid</option>
                  <option value="08019">Barcelona</option>
                  <option value="46250">Valencia</option>
                  <option value="41091">Sevilla</option>
                  <option value="48020">Bilbao</option>
                  <option value="3550308">São Paulo</option>
                  <option value="3304557">Río de Janeiro</option>
                  <option value="5300108">Brasilia</option>
                  <option value="2304400">Fortaleza</option>
                  <option value="2927408">Salvador de Bahía</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Teléfono -->
        <div class="form-group">
          <label for="telefono">Número de teléfono<span class="required-mark">*</span></label>
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1.1.4 2.1.7 3.1a2 2 0 0 1-.5 2.1L8 10.1a16 16 0 0 0 6 6l1.2-1.3a2 2 0 0 1 2.1-.5c1 .3 2 .6 3.1.7a2 2 0 0 1 1.7 2z"></path>
            </svg>
            <input
              type="tel"
              id="telefono"
              name="telefono"
              placeholder="Ej: 3001234567"
              autocomplete="tel">
          </div>
        </div>

        <!-- Tratamiento de datos -->
        <div class="checkbox-group">
          <input
            type="checkbox"
            id="tratamiento_datos"
            name="tratamiento-datos"
            required>
          <label for="tratamiento_datos">
            Autorizo el tratamiento de mis datos personales de acuerdo con la política de privacidad.
          </label>
        </div>

        <!-- Botones -->
        <div class="form-actions">
          <button type="submit" class="btn-submit">Enviar</button>
        </div>

 </form>
         
      
      
      
     <div>
      <form id="formPokedex">
      <div class="field">
        <label>Inserte el nombre del Pokemon :D</label>
        <input type="text" id="pokemonInput" placeholder="Ej: Pikachu , Charmander ..." class="required-mark">
      </div>
   
      <div> 
            <button type="submit"> Buscar </button>
      </div>
    </form>
  </div>

  <div id="resultadoPokemon">
    <img src="">
    <p>Lero Lero Candelero</p> 
  </div>


<script src="JS/script.js"></script>
</body>
</html>
